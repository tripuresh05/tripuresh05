name: Generate Snake

# Run daily + manual + on push to main
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: generate-snake-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: tripuresh05
          outputs: dist/snake.svg

      - name: Publish dist to output branch (gh-pages style)
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for pushing generated assets)
        uses: actions/checkout@v4
        with:
          persist-credentials: true    # use the GITHUB_TOKEN for push
          fetch-depth: 0

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: stats
          options: 'username=tripuresh05&show_icons=true&theme=tokyonight&hide_border=true'
          path: stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: top-langs
          options: 'username=tripuresh05&layout=compact&theme=tokyonight&hide_border=true&langs_count=8'
          path: top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push stats (if changed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Ensure we are on the branch that triggered the workflow (usually main)
          git checkout "${GITHUB_REF#refs/heads/}" || git checkout -b main
          git add stats.svg top-langs.svg
          if git diff --cached --quiet; then
            echo "No changes to commit for stats"
            exit 0
          fi
          git commit -m "chore: update stats and top-langs"
          # Push with retries to handle transient failures
          for i in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF#refs/heads/}" && break
            echo "Push failed, retrying ($i/3)..."
            sleep $((i * 2))
          done

  trophy:
    needs: stats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for pushing generated trophy)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Generate trophy SVG
        # This action currently exposes the generate-svg branch.
        # If a stable tag/sha appears later, replace feature/generate-svg with a tag or sha.
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: tripuresh05
          file: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push trophy (if changed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout "${GITHUB_REF#refs/heads/}" || git checkout -b main
          git add trophy.svg
          if git diff --cached --quiet; then
            echo "No changes to commit for trophy"
            exit 0
          fi
          git commit -m "chore: update trophy"
          for i in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF#refs/heads/}" && break
            echo "Push failed, retrying ($i/3)..."
            sleep $((i * 2))
          done
