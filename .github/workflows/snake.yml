name: Generate Profile Assets & Snake

on:
  schedule:
    # Run every 4 hours to keep stats and snake constantly up-to-date
    - cron: "0 */4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "**.svg"
      - "assets/**"

concurrency:
  group: profile-update-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # 1. Generate Snake contribution animation SVGs
      - name: Generate Snake Animation SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: tripuresh05
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=%2300E676&color_dots=%23161b22,%230e4429,%23006d32,%2326a641,%2339d353
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      # 2. Publish snake SVGs to output branch
      - name: Publish Snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_files: false
          commit_message: "chore: update snake animation [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      # 3. Generate GitHub Stats Card (Total + Private Commits included)
      - name: Generate GitHub Stats Card
        uses: stats-organization/github-readme-stats-action@v1
        continue-on-error: true
        with:
          card: stats
          options: 'username=tripuresh05&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&count_private=true&show=reviews,discussions_answered,prs_merged'
          path: stats.svg
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      # 4. Generate Top Languages Card
      - name: Generate Top Languages Card
        uses: stats-organization/github-readme-stats-action@v1
        continue-on-error: true
        with:
          card: top-langs
          options: 'username=tripuresh05&layout=compact&theme=tokyonight&hide_border=true&langs_count=10&count_private=true'
          path: top-langs.svg
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      # 5. Generate GitHub Profile Trophies
      - name: Generate Trophy Card
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        continue-on-error: true
        with:
          username: tripuresh05
          file: trophy.svg
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          theme: tokyonight
          column: 7
          no-frame: false
          margin-w: 10
          margin-h: 10

      # 6. Commit and Push Generated Stats & Trophies to main
      - name: Commit and Push Updated Stats & Trophies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg top-langs.svg trophy.svg
          if git diff --staged --quiet; then
            echo "No changes in SVG assets."
          else
            git commit -m "chore(assets): update profile stats & trophies [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main || true
              git push origin HEAD:main && break || sleep 5
            done
          fi
